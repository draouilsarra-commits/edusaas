{% extends "base.html" %}{% block title %}Mot de passe{% endblock %}
{% block content %}<h1>Changer mon mot de passe</h1><p class="sub">Remplacez le mot de passe temporaire de démonstration.</p>
<div class="card" style="max-width:460px"><form method="post" class="form-grid" style="grid-template-columns:1fr">
<input type="hidden" name="_csrf" value="{{ csrf_token }}">
<label>Mot de passe actuel<input type="password" name="old" required></label>
<label>Nouveau mot de passe (8 caractères min.)<input type="password" name="new" required minlength="8"></label>
<div><button class="btn">Enregistrer</button></div></form></div>{% endblock %}
